[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etuner"
version = "0.2.0"
description = "Smart music metadata repair system — clean tags, normalize artists, fix sorting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ean" }]
dependencies = [
    "mutagen>=1.47",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# `etuner fetch --method acoustid` additionally needs the `fpcalc` binary
# from Chromaprint installed on PATH — that's a system package, not pip.

[project.scripts]
etuner = "etuner.cli:main"

[tool.setuptools.packages.find]
include = ["etuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
