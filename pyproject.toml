[project]
name = "vividly-musicaly"
version = "0.1.0"
description = "Local music library manager and download organizer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "mutagen>=1.47",
    "yt-dlp>=2025.6",
    "pydantic>=2.8",
]

[project.scripts]
bigpickle = "backend.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
