<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="loom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc36e"/>
      <stop offset="1" stop-color="#e8912d"/>
    </linearGradient>
  </defs>
  <!-- rounded dark tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#16161c" stroke="#33333d" stroke-width="1.5"/>
  <!-- warp threads: vertical bars of varying height (the waveform) -->
  <g stroke="url(#loom)" stroke-width="4" stroke-linecap="round">
    <line x1="16" y1="26" x2="16" y2="38"/>
    <line x1="24" y1="20" x2="24" y2="44"/>
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="40" y1="20" x2="40" y2="44"/>
    <line x1="48" y1="26" x2="48" y2="38"/>
  </g>
  <!-- weft thread: a single line weaving through the bars -->
  <path d="M12 32 C 19 32, 21 22, 28 22 S 37 42, 44 42 51 32, 52 32"
        fill="none" stroke="#ececf1" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
